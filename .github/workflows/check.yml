name: check

# Every record set under records/ read as plugin-qualify-sync reads it (tools/check-records.py): its provenance names
# its set and host class, every record has its probe output beside it with the size and SHA-256 it names, a set named
# for a cell holds only that cell, and nothing else is shipped. The RPM's %check and the release run the same script.
# tools/sets.py check holds the one package, plugin-qualification-records, to the sets: every class under records/ has
# an architecture (packaging/arch-classes), debian/control and the spec build it for those architectures, and the
# architectures a tag releases (packaging/release-arches) carry sets.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # no Fedora release written into a job: the cells come from check-matrix (rule 11-10, ruling D25)
  fedora-cells:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - uses: Open-Mixer/.github/.github/actions/fedora-cells@openmixer-v1

  records:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-records.py
      - run: python3 -m unittest tools/test_check_records.py
      - run: python3 -m unittest tools/test_fedora44_channel_check.py
      - run: python3 -m unittest tools/test_fedora44_deliver.py
      - run: python3 -m unittest tools/test_build_package.py
      - run: python3 -m unittest tools/test_sets.py
      - run: python3 -m unittest tools/test_fedora44_rt.py
      - run: bash -n tools/build-package.sh tools/prove-set.sh tools/fedora44/measure.sh tools/fedora44/channel-check.sh
      # every class under records/ is carried by an architecture of the one package, debian/control and the spec's
      # per-architecture block are what packaging/arch-classes and records/ give, and the spec's Version is
      # debian/changelog's: a tag must equal both
      - name: The package builds the sets this tree holds
        run: python3 tools/sets.py check

  # the commit messages, private references and layout every OpenMixer repository is held to
  public-sources:
    uses: Open-Mixer/.github/.github/workflows/public-sources-check.yml@openmixer-v1
