name: check

# Every record set under records/ read as plugin-qualify-sync reads it (tools/check-records.py): its provenance names
# its set and host class, every record has its probe output beside it with the size and SHA-256 it names, a set named
# for a cell holds only that cell, and nothing else is shipped. The RPM's %check and the release run the same script.
# tools/sets.py check holds the one package, plugin-qualification-records, to the sets: every class under records/ has
# an architecture (packaging/arch-classes), debian/control and the spec build it for those architectures, and the
# architectures a tag releases (packaging/release-arches) carry sets.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trigger-gate:
    name: only this workflow runs on a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/trigger-gate@openmixer-v1
        with:
          lint-workflow: check.yml

  records:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # the words of a provenance are the qualification domain's, plugin-hostd's: read from its main (the records job
    # installs no package), where check-records.py looks first, OMX_CONTRACT_PATH
    env:
      OMX_CONTRACT_PATH: ${{ github.workspace }}/siblings/plugin-hostd/contract.d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: Open-Mixer/plugin-hostd, path: siblings/plugin-hostd}
      - run: python3 tools/check-records.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: bash -n tools/build-package.sh tools/prove-set.sh tools/fedora44/measure.sh tools/fedora44/channel-check.sh
      # Fedora 45 only: a workflow that builds or runs Fedora 44 is refused; fedora44, the name of the sets measured
      # there, is data and stays
      - name: No Fedora 44 build or container in the workflows
        run: |
          tools/test/workflow-fedora-check.sh --self-test
          tools/test/workflow-fedora-check.sh .
      # every class under records/ is carried by an architecture of the one package, debian/control and the spec's
      # per-architecture block are what packaging/arch-classes and records/ give, and the spec's Version is
      # debian/changelog's: a tag must equal both
      - name: The package builds the sets this tree holds
        run: python3 tools/sets.py check

  # The reader (libplugin-qualification-db, its command and their tests): built with pkg-config's flags against the
  # channel's libomx-domain, as a consumer builds it. `make check` builds the fixture stores from schema/qualification.sql.
  reader:
    name: the reader builds and passes make check
    runs-on: ${{ github.event.repository.private && 'arc-freemixer' || github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.OMX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    container:
      image: fedora:45
    steps:
      - name: Install the build tools
        run: dnf install -y --setopt=install_weak_deps=False git dnf5-plugins gcc gcc-c++ make python3 binutils pkgconf-pkg-config sqlite-devel diffutils gawk sed grep findutils
      - name: Add the OpenMixer repository
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
      - name: Install the contract loader
        run: dnf install -y --setopt=install_weak_deps=False libomx-domain-devel omx-contract-devel
      - uses: actions/checkout@v4
      # an ordinary run builds against the channel: refuse an omx package from the staging channel
      - name: Every omx package comes from the channel
        env:
          DEVEL_PR: ${{ startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel' }}
        run: |
          set -euo pipefail
          dnf repoquery --installed --qf '%{name} %{version} %{from_repo}\n' 'omx-*' 'libomx-*' | tee /tmp/from-repo
          # a pull request into devel builds against the staging channel (Open-Mixer/.github#271): a staged package is
          # what it tests, so only every other run refuses one
          if [ "$DEVEL_PR" != true ] && grep staging /tmp/from-repo; then echo "a package above came from the staging channel: an ordinary run builds against the channel"; exit 1; fi
      - run: make check
      # the hosting exception of the store spec (section 3.4) ends when omx-clap ships a `hosting` domain: fail while
      # its main holds contract.d/hosting/hosting.json and the reader still skips that domain (a read-only clone). main
      # by name: the default branch is devel, where a domain lands before it ships
      - name: The hosting exception ends with omx-clap's hosting domain
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/Open-Mixer/omx-clap-core.git /tmp/omx-clap
          sh tools/hosting-skip-ends.sh /tmp/omx-clap src/pqdb.c

  # The layer writer (tools/qualification_db.py put and delete, and the command): its refusals by name. The words are the
  # owners' own, read from the same branch of theirs (tools/sibling_contract.py assembles the contract directory from these clones:
  # qualification and machine are plugin-hostd's, probe plugin-hostd-protocol's); the hosting words are the data/ of
  # omx-clap-core's contract.d/hosting, from its clone siblings/omx-clap-core.
  layer-writer:
    name: the layer writer refuses by name
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PDQ_SIBLINGS: ${{ github.workspace }}/siblings
      # the owners' words of the branch this change lands on: a pull request into devel reads the siblings' devel
      PDQ_REF: origin/${{ github.base_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: Open-Mixer/plugin-hostd, path: siblings/plugin-hostd, fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {repository: Open-Mixer/plugin-hostd-protocol, path: siblings/plugin-hostd-protocol, fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {repository: Open-Mixer/plugin-db, path: siblings/plugin-db, fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {repository: Open-Mixer/omx-clap-core, path: siblings/omx-clap-core, fetch-depth: 0}
      - run: sudo apt-get install -y --no-install-recommends python3-jsonschema
      # every test reads the siblings' words: a skip means a sibling was not found where tools/sibling_contract.py
      # reads it (siblings/<repository>), and a run that skips is red
      - run: |
          set -o pipefail
          python3 -m unittest tools/test_qualification_db_write.py 2>&1 | tee unittest.log
          ! grep -q 'skipped=' unittest.log

  # The base database (tools/records-db.py) over every record of records/: the round trip, the counts, the refusals. The
  # words are the owners' own, read from the same branch of theirs (tools/sibling_contract.py, as for the layer writer); the hosting
  # words are omx-clap-core's contract.d/hosting, from its clone siblings/omx-clap-core.
  records-db:
    name: the base database round-trips records/
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PDQ_SIBLINGS: ${{ github.workspace }}/siblings
      # the owners' words of the branch this change lands on: a pull request into devel reads the siblings' devel
      PDQ_REF: origin/${{ github.base_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: Open-Mixer/plugin-hostd, path: siblings/plugin-hostd, fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {repository: Open-Mixer/plugin-hostd-protocol, path: siblings/plugin-hostd-protocol, fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {repository: Open-Mixer/plugin-db, path: siblings/plugin-db, fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {repository: Open-Mixer/omx-clap-core, path: siblings/omx-clap-core, fetch-depth: 0}
      - run: sudo apt-get install -y --no-install-recommends python3-jsonschema
      # every test reads the siblings' words: a skip means a sibling was not found where tools/sibling_contract.py
      # reads it (siblings/<repository>), and a run that skips is red
      - run: |
          set -o pipefail
          python3 -m unittest tools/test_records_db.py 2>&1 | tee unittest.log
          ! grep -q 'skipped=' unittest.log

  # the commit messages, private references and layout every OpenMixer repository is held to
  public-sources:
    uses: Open-Mixer/.github/.github/workflows/public-sources-check.yml@openmixer-v1

  deps-render:
    name: the packaging states floors only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/deps-render@openmixer-v1

  pr-fixes-issue:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: Open-Mixer/.github/.github/workflows/pr-fixes-issue.yml@openmixer-v1
