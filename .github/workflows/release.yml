name: release

# A version tag builds the one records package, plugin-qualification-records, for the architectures
# packaging/release-arches names (tools/sets.py github-output reads it): each architecture's package carries the
# record sets of its machine classes (packaging/arch-classes). The Debian packages are built from debian/ on a runner
# of their own architecture, linted, signed and published into the deb/ tree of the OpenMixer Pages repository and
# attached to the GitHub release; the arm64 one is then installed in Debian trixie on arm64 beside plugin-qualify
# from the channel, and plugin-qualify-sync --system takes plugins from every set it carries. The RPMs are built from
# packaging/plugin-qualification-records.spec (whose Version is the tag's too), published into the rpm/ tree and
# proven the same way in Fedora 45 on x86_64 (tools/sets.py prove, tools/prove-set.sh). A manual run builds and proves
# the same and publishes nothing unless `publish` is set, and even then only on a tag. The build and the publish are
# in Open-Mixer/.github; the secrets (OPENMIXER_PACKAGES_SIGNING_KEY, PAGES_TOKEN) are the organisation's.
#
# arm64 is released first: its package depends on a plugin-qualify the channel serves. The amd64 deb and the x86_64
# rpm join packaging/release-arches in a later dated version, once plugin-qualify 0.20.1 is in the channel.

on:
  push:
    tags: ['v*']
    # a merge to devel builds the real package and publishes it to staging (Open-Mixer/.github#289)
    branches: [devel]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on a tag publishes'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  plan:
    name: What this version releases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deb-arches: ${{ steps.read.outputs.deb-arches }}
      deb-run: ${{ steps.read.outputs.deb-run }}
      deb-names: ${{ steps.read.outputs.deb-names }}
      deb-prove: ${{ steps.read.outputs.deb-prove }}
      rpm-arches: ${{ steps.read.outputs.rpm-arches }}
      rpm-run: ${{ steps.read.outputs.rpm-run }}
      rpm-names: ${{ steps.read.outputs.rpm-names }}
      rpm-prove: ${{ steps.read.outputs.rpm-prove }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -euo pipefail
          # a republish repacked one Architecture: all package of one set under a new version; the records are now
          # one package per architecture, which is built, not repacked
          if [ -f debian/republish ]; then
            echo "::error::debian/republish: a republish repacks one Architecture: all package of one set; plugin-qualification-records is one package per architecture, built from debian/. Remove the file and release a new version."
            exit 1
          fi
          python3 tools/sets.py check
          python3 tools/sets.py github-output

  # The DEB builds beside the RPM: the organisation's build workflows serialise their publish jobs, one group per target.
  deb:
    needs: plan
    if: needs.plan.outputs.deb-run == 'true'
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      # the source package is named for the repository, which keeps the .changes file name short for lintian
      package-name: plugin-db-qualification
      binary-names: ${{ needs.plan.outputs.deb-names }}
      publish: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.publish == true }}
      # the arm64 records are for plugin-qualify on a Raspberry Pi 5 running Debian (Zynthian's base, trixie, and the
      # bookworm images before it); the reader builds with sqlite, pkgconf and the channel's libomx-domain-dev, the records with python3 (tools/sets.py)
      dependencies: ''
      requires: ''
      # the reader's Build-Depends libomx-domain-dev comes from the channel; sqlite and pkgconf are Debian's
      channel-deps: true
      build-packages: python3
      # trixie only: the channel has no bookworm suite to install plugin-qualify from, so a bookworm package could not
      # pass its install check; ZynthianOS Vangelis is trixie
      suite-matrix: '["trixie"]'
      arch-matrix: ${{ needs.plan.outputs.deb-arches }}
      # the cycle with plugin-hostd, as the rpm job below says
      bootstrap: ${{ github.ref == 'refs/heads/devel' && 'Open-Mixer/plugin-hostd@05fbbb58abafd89964099dd86b13ff621ab7c2dd:plugin-hostd-contract' || '' }}
    secrets: inherit

  # The arm64 package installed where it is used: arm64 Debian trixie with plugin-qualify from the channel and
  # Debian's own lv2vocoder, whose bytes are the ones the Zynthian image holds (checked against the records'
  # SHA-256s; the image's other Debian plugins have since been rebuilt, so their records rightly do not apply). The
  # sync takes it from the records and measures nothing. If Debian rebuilds lv2vocoder this step fails with
  # `binary differs`: pick another plugin whose installed files still hash as a record's.
  # It runs only when the build ran: a merge to devel whose version is served builds nothing (the build's skipped
  # output), and there is no artifact to install. On a merge to devel it does not run at all: the sync it proves is
  # plugin-qualify, a later line of the devel wave (it builds on plugin-hostd, which builds on this reader), so the
  # staging channel has none yet; the tag that promotes the staged build proves it against the channel.
  installed:
    name: Install and sync (trixie, arm64)
    needs: [plan, deb]
    if: ${{ !cancelled() && needs.deb.result == 'success' && needs.deb.outputs.skipped != 'true' && github.ref != 'refs/heads/devel' && needs.plan.outputs.deb-prove == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: plugin-db-qualification-debs-trixie-arm64
          path: pkgs

      - name: Prepare the container
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl

      - uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # a pull request into devel in a wave reads that wave's devel channel above staging (Open-Mixer/.github#329)
          devel-channel: ${{ startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel' && vars.OMX_DEVEL_CHANNEL || '' }}

      # the package installed once; each set it carries proven in turn (tools/prove-set.sh: a container has no
      # device tree, so the host class is the settings file's, and a set of one cell sets the sync's grid to it)
      - name: The package installed, and plugin-qualify-sync --system applies each set's records
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends python3
          python3 tools/sets.py prove deb pkgs
        env:
          PROVE_NOTES: ${{ github.workspace }}/proof-notes-deb.md

      - name: What the proof found, for the release notes
        if: ${{ !cancelled() }}
        run: |
          [ -s proof-notes-deb.md ] || exit 0
          { echo '## Install and sync proof (deb)'; echo; cat proof-notes-deb.md; } | tee proof-notes-deb-section.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof-notes-deb
          path: proof-notes-deb-section.md
          if-no-files-found: ignore

  # The RPM: plugin-qualification-records for each architecture packaging/release-arches names, built from
  # packaging/ by the organisation's RPM path (its %check runs tools/check-records.py over each installed set),
  # signed and published into the rpm/ tree on a tag.
  rpm:
    needs: plan
    if: needs.plan.outputs.rpm-run == 'true'
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      package-name: plugin-qualification-records
      binary-names: ${{ needs.plan.outputs.rpm-names }}
      publish: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.publish == true }}
      # the records are data, built per architecture; no mod-host
      arch-matrix: ${{ needs.plan.outputs.rpm-arches }}
      needs-mod-host: false
      # the reader's BuildRequires libomx-domain-devel comes from the channel
      channel-deps: true
      # the real build cycle with plugin-hostd: plugin-hostd builds on this reader,
      # and the base database's words are checked against plugin-hostd's domains (BuildRequires plugin-hostd-contract).
      # On a merge to devel the staging channel has no plugin-hostd of the wave yet, so the data package alone is built
      # from the wave's plugin-hostd head (Open-Mixer/.github#230) and never released; plugin-hostd's own release
      # replaces it. A tag builds on the channel's plugin-hostd-contract.
      bootstrap: ${{ github.ref == 'refs/heads/devel' && 'Open-Mixer/plugin-hostd@05fbbb58abafd89964099dd86b13ff621ab7c2dd:plugin-hostd-contract' || '' }}
    secrets: inherit

  # The x86_64 RPM installed where it is used, each set in turn: Fedora 45 x86_64 with plugin-qualify and the
  # channel's current omx-plugins (the channel keeps the newest only; the proof logs the version each set measured
  # beside the one installed). A container has no device tree, and an x86_64 machine never has one, so the host class
  # is the settings file's. A record of bytes the channel no longer serves (`binary differs`, another omx-plugins
  # version than the measured one) is UNPROVEN: it stays as measured and the release notes name it (proof-notes).
  # Only when the build ran, and not on a merge to devel, as the deb proof above (the staging channel has no
  # plugin-qualify of the wave yet).
  rpm-installed:
    name: Install and sync (Fedora 45, x86_64)
    needs: [plan, rpm]
    if: ${{ !cancelled() && needs.rpm.result == 'success' && needs.rpm.outputs.skipped != 'true' && github.ref != 'refs/heads/devel' && needs.plan.outputs.rpm-prove == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: fedora:45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: plugin-qualification-records-rpms-fc45-x86_64
          path: pkgs

      - uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # a pull request into devel in a wave reads that wave's devel channel above staging (Open-Mixer/.github#329)
          devel-channel: ${{ startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel' && vars.OMX_DEVEL_CHANNEL || '' }}

      - name: The package installed, and plugin-qualify-sync --system applies each set's records
        run: |
          set -euo pipefail
          # fedora:45 has no python3; tools/sets.py and the provenance read need it
          dnf install -y --setopt=install_weak_deps=False python3
          python3 tools/sets.py prove rpm pkgs
        env:
          PROVE_NOTES: ${{ github.workspace }}/proof-notes-rpm.md

      - name: What the proof found, for the release notes
        if: ${{ !cancelled() }}
        run: |
          [ -s proof-notes-rpm.md ] || exit 0
          { echo '## Install and sync proof (rpm)'; echo; cat proof-notes-rpm.md; } | tee proof-notes-rpm-section.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof-notes-rpm
          path: proof-notes-rpm-section.md
          if-no-files-found: ignore

  # On a tag, what the proofs found (the set plugin-qualify takes at each cell against the store rule's winner, the
  # WRONG WINNER cells, the UNPROVEN sets) joins the release notes the build created, once: an earlier section of
  # the same name is replaced. Without a release the notes stay in the job summaries.
  proof-notes:
    name: The proofs' findings in the release notes
    needs: [installed, rpm-installed]
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.installed.result) && contains(fromJSON('["success","skipped"]'), needs.rpm-installed.result) && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: proof-notes-*
          path: notes
          merge-multiple: true
      - name: Append them to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(notes/proof-notes-*-section.md)
          [ "${#files[@]}" -gt 0 ] || { echo "the proofs found nothing to note"; exit 0; }
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body) || { echo "::notice::no release $TAG to carry the proofs' findings; they are in the job summaries"; exit 0; }
          body=${body%%$'\n## Install and sync proof'*}
          printf '%s\n' "$body" > body.md
          # the UNPROVEN records lists go to release assets proof-notes-<kind>-records.md; notes still over the 125000
          # characters a release body may hold fail by name
          python3 tools/release-notes.py body.md notes notes.md assets
          for a in assets/proof-notes-*-records.md; do
            [ -e "$a" ] || continue
            gh release upload "$TAG" "$a" --repo "$GITHUB_REPOSITORY" --clobber
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
