name: release

# A version tag builds the one records package, plugin-qualification-records, for the architectures
# packaging/release-arches names (tools/sets.py github-output reads it): each architecture's package carries the
# record sets of its machine classes (packaging/arch-classes). The Debian packages are built from debian/ on a runner
# of their own architecture, linted, signed and published into the deb/ tree of the FreeMixer Pages repository and
# attached to the GitHub release; the arm64 one is then installed in Debian trixie on arm64 beside plugin-qualify
# from the channel, and plugin-qualify-sync --system takes plugins from every set it carries. The RPMs are built from
# packaging/plugin-qualification-records.spec (whose Version is the tag's too), published into the rpm/ tree and
# proven the same way in Fedora 44 on x86_64 (tools/sets.py prove, tools/prove-set.sh). A manual run builds and proves
# the same and publishes nothing unless `publish` is set, and even then only on a tag. The build and the publish are
# in Open-Mixer/.github; the secrets (OPENMIXER_PACKAGES_SIGNING_KEY, PAGES_TOKEN) are the organisation's.
#
# arm64 is released first: its package depends on a plugin-qualify the channel serves. The amd64 deb and the x86_64
# rpm join packaging/release-arches in a later dated version, once plugin-qualify 0.20.1 is in the channel.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on a tag publishes'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  plan:
    name: What this version releases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deb-arches: ${{ steps.read.outputs.deb-arches }}
      deb-run: ${{ steps.read.outputs.deb-run }}
      deb-names: ${{ steps.read.outputs.deb-names }}
      deb-prove: ${{ steps.read.outputs.deb-prove }}
      rpm-arches: ${{ steps.read.outputs.rpm-arches }}
      rpm-run: ${{ steps.read.outputs.rpm-run }}
      rpm-names: ${{ steps.read.outputs.rpm-names }}
      rpm-prove: ${{ steps.read.outputs.rpm-prove }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -euo pipefail
          # a republish repacked one Architecture: all package of one set under a new version; the records are now
          # one package per architecture, which is built, not repacked
          if [ -f debian/republish ]; then
            echo "::error::debian/republish: a republish repacks one Architecture: all package of one set; plugin-qualification-records is one package per architecture, built from debian/. Remove the file and release a new version."
            exit 1
          fi
          python3 tools/sets.py check
          python3 tools/sets.py github-output

  # A release is one wave: the DEB waits for the RPM job and runs only when it passed (the organisation's release-order
  # check). While packaging/release-arches names no RPM architecture the RPM job is skipped and the DEB goes alone.
  deb:
    needs: [plan, rpm]
    if: ${{ !cancelled() && needs.plan.outputs.deb-run == 'true' && (needs.plan.outputs.rpm-run != 'true' || needs.rpm.result == 'success') }}
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      # the source package is named for the repository, which keeps the .changes file name short for lintian
      package-name: plugin-db-qualification
      binary-names: ${{ needs.plan.outputs.deb-names }}
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      # the arm64 records are for plugin-qualify on a Raspberry Pi 5 running Debian (Zynthian's base, trixie, and the
      # bookworm images before it); no build dependency beyond debhelper and python3 (tools/sets.py)
      dependencies: ''
      requires: ''
      channel-deps: false
      build-packages: python3
      # trixie only: the channel has no bookworm suite to install plugin-qualify from, so a bookworm package could not
      # pass its install check; ZynthianOS Vangelis is trixie
      suite-matrix: '["trixie"]'
      arch-matrix: ${{ needs.plan.outputs.deb-arches }}
    secrets: inherit

  # The arm64 package installed where it is used: arm64 Debian trixie with plugin-qualify from the channel and
  # Debian's own lv2vocoder, whose bytes are the ones the Zynthian image holds (checked against the records'
  # SHA-256s; the image's other Debian plugins have since been rebuilt, so their records rightly do not apply). The
  # sync takes it from the records and measures nothing. If Debian rebuilds lv2vocoder this step fails with
  # `binary differs`: pick another plugin whose installed files still hash as a record's.
  installed:
    name: Install and sync (trixie, arm64)
    needs: [plan, deb]
    if: ${{ !cancelled() && needs.deb.result == 'success' && needs.plan.outputs.deb-prove == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: plugin-db-qualification-debs-trixie-arm64
          path: pkgs

      - name: Prepare the container
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl

      - uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1

      # the package installed once; each set it carries proven in turn (tools/prove-set.sh: a container has no
      # device tree, so the host class is the settings file's, and a set of one cell sets the sync's grid to it)
      - name: The package installed, and plugin-qualify-sync --system applies each set's records
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends python3
          python3 tools/sets.py prove deb pkgs

  # The RPM: plugin-qualification-records for each architecture packaging/release-arches names, built from
  # packaging/ by the organisation's RPM path (its %check runs tools/check-records.py over each installed set),
  # signed and published into the rpm/ tree on a tag.
  rpm:
    needs: plan
    if: needs.plan.outputs.rpm-run == 'true'
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      package-name: plugin-qualification-records
      binary-names: ${{ needs.plan.outputs.rpm-names }}
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      # data, built per architecture; no mod-host, no channel BuildRequires
      arch-matrix: ${{ needs.plan.outputs.rpm-arches }}
      needs-mod-host: false
      channel-deps: false
    secrets: inherit

  # The x86_64 RPM installed where it is used, each set in turn: Fedora 44 x86_64 with plugin-qualify and the
  # channel's omx-plugins at the version the set measured (its provenance.json). A container has no device tree, and
  # an x86_64 machine never has one, so the host class is the settings file's. The sync takes the omx plugins from the
  # records and measures nothing. When the channel's omx-plugins of that version is rebuilt with other bytes this
  # step fails with `binary differs`: the set is then due to be measured again.
  rpm-installed:
    name: Install and sync (Fedora 44, x86_64)
    needs: [plan, rpm]
    if: ${{ !cancelled() && needs.rpm.result == 'success' && needs.plan.outputs.rpm-prove == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: fedora:44
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: plugin-qualification-records-rpms-fc44-x86_64
          path: pkgs

      - uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1

      - name: The package installed, and plugin-qualify-sync --system applies each set's records
        run: |
          set -euo pipefail
          # fedora:44 has no python3; tools/sets.py and the provenance read need it
          dnf install -y --setopt=install_weak_deps=False python3
          python3 tools/sets.py prove rpm pkgs
